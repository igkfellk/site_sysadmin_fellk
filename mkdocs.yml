site_name: SRE / Sysadmin Notes
theme:
  name: material
  language: ru
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
nav:
  - Home: index.md
  - Linux:
    - linux/index.md
    - linux/systemd.md
#    - troubleshooting: linux/troubleshooting.md
  - Networking:
    - networking/index.md
    - networking/tcpdump.md
  - Monitoring:
    - monitoring/index.md
    - monitoring/promql.md
  - Python:
    - python/index.md
    - python/scripts.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
extra_css:
  - stylesheets/extra.css
